name: Verify Midnight Poker Club

on:
  push:
    branches:
      - fix/configurable-multiplayer-backend
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Production frontend build
        run: npm run build
      - name: Smoke test Enzonic index.js entrypoint
        shell: bash
        run: |
          set -euo pipefail
          PORT=38129 node index.js >/tmp/midnight-enzonic-startup.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ok=0
          for attempt in {1..25}; do
            if curl --fail --silent http://127.0.0.1:38129/api/health > /tmp/midnight-enzonic-health.json; then
              ok=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo 'Node launcher exited unexpectedly:'
              cat /tmp/midnight-enzonic-startup.log
              exit 1
            fi
            sleep 1
          done
          if [[ "$ok" != 1 ]]; then
            echo 'Node launcher never became healthy:'
            cat /tmp/midnight-enzonic-startup.log
            exit 1
          fi
          node -e "const h = require('/tmp/midnight-enzonic-health.json'); if (h.multiplayerAvailable !== true) process.exit(1)"
