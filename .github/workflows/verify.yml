name: Verify Midnight Poker Club

on:
  push:
    branches:
      - fix/configurable-multiplayer-backend
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Production frontend build
        run: npm run build
