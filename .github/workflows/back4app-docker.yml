name: Verify Back4app Docker image
on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/back4app-docker.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
jobs:
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --tag midnight-poker-back4app:verify .
